name: Release

# Push a tag that exactly matches manifest.json's version (e.g. 1.0.0) and this
# builds the plugin, runs the tests, and publishes a GitHub release with the
# three files Obsidian installs: manifest.json, main.js, styles.css.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and test
        # legacy-peer-deps: obsidian@latest pins exact @codemirror peers that
        # clash with our ranged devDeps; both are esbuild externals, so the
        # relaxed resolution can't affect the built artifact.
        run: |
          npm install --legacy-peer-deps
          npm test
          npm run build

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # idempotent: create the release the first time, refresh its assets on a
          # re-pushed tag instead of failing (a force-pushed tag re-runs this)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" manifest.json main.js styles.css --clobber
          else
            gh release create "$tag" --title "$tag" \
              --notes "See the README for what's included." \
              manifest.json main.js styles.css
          fi
